<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60">
  <defs>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  <!-- Icon Badge -->
  <g transform="translate(6, 8)">
    <circle cx="22" cy="22" r="22" fill="#EBFBF0" stroke="#DCFCE7" stroke-width="1.5"/>
    <!-- Organic Leaf Shape -->
    <path d="M 22,7 C 32,7 39,15 37,27 C 35,35 28,38 22,38 C 15,38 7,32 8,21 C 9,12 15,7 22,7 Z" fill="url(#leafGrad)"/>
    <!-- Leaf Vein & Sprout -->
    <path d="M 22,37 C 22,26 27,16 34,12" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <path d="M 23,25 C 27,23 32,24 34,26" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    <!-- Small Sun / Fresh Dot -->
    <circle cx="34" cy="11" r="4" fill="url(#amberGrad)"/>
  </g>
  <!-- Brand Text -->
  <text x="58" y="38" font-family="'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="26" fill="#0F172A" letter-spacing="-0.5">Fresh<tspan fill="#16A34A">Leaf</tspan></text>
</svg>
